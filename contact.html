<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow"><meta name="theme-color" content="#131313"><title>Contact｜八乃ぺんた 3D Model Studio</title>  <script type="module" crossorigin src="./assets/contact-CTIo_rSa.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/shared-DvbPN3cq.js">
  <link rel="stylesheet" crossorigin href="./assets/shared-CI_n5fS6.css">
</head><body>
<div id="site-header"></div><main id="main"><section class="page-hero"><div class="page-hero-inner"><p class="eyebrow">Project planner</p><h1>CONTACT</h1><p>まだ仕様が決まっていなくても大丈夫。分かる範囲を選ぶと、方式の目安と相談メモをその場で作れます。</p></div></section><section class="page-content"><div class="page-content-inner contact-layout"><aside class="contact-guide"><p class="section-kicker">Before inquiry</p><h2>最初に必要なのは、<br>完成した仕様書ではありません。</h2><p>「どこで使いたいか」「何を大事にしたいか」が分かれば、必要な工程をこちらで整理できます。</p><div class="flow-mini"><div><b>1</b>フォームで希望を整理</div><div><b>2</b>相談メモをコピー</div><div><b>3</b>DM・メールで相談</div><div><b>4</b>ヒアリング・お見積り</div><div><b>5</b>ご契約後に制作開始</div></div></aside>
<form class="contact-form" id="project-planner"><div class="form-grid"><div class="field"><label for="use">主な用途</label><select id="use" name="use"><option value="">選択してください</option><option value="stream">配信・VTuber</option><option value="vrchat">VRChat</option><option value="video">映像・MV</option><option value="event">イベント・ライブ</option></select></div><div class="field"><label for="change">衣装展開</label><select id="change" name="change"><option value="">選択してください</option><option value="often">頻繁に追加したい</option><option value="sometimes">年に数回</option><option value="rare">ほぼ固定</option></select></div><div class="field"><label for="detail">いちばん大切なこと</label><select id="detail" name="detail"><option value="">選択してください</option><option value="balanced">品質と予算のバランス</option><option value="high">造形・体型へのこだわり</option><option value="speed">公開時期・スピード</option></select></div><div class="field"><label for="budget">予算の目安</label><select id="budget" name="budget"><option value="">選択してください</option><option>30〜50万円</option><option>50〜80万円</option><option>80〜100万円</option><option>100万円以上</option><option>相談して決めたい</option></select></div><div class="field full"><label for="timing">希望時期</label><input id="timing" name="timing" placeholder="例：2027年春頃、未定" /></div><div class="field full"><label for="note">こだわり・困っていること</label><textarea id="note" name="note" placeholder="例：身体のスタイルを大切にしたい／VRChatでも使いたい／三面図がまだありません"></textarea><span class="form-hint">分からない項目は空欄のままで大丈夫です。</span></div></div><div class="recommendation" id="method-recommendation" aria-live="polite"></div><div class="field full"><label for="request-summary">自動作成された相談メモ</label><textarea id="request-summary" name="summary" readonly></textarea></div><button class="button" type="submit">相談メモをコピー</button><p class="copy-status" id="copy-status" aria-live="polite"></p><p class="form-hint">このフォームから直接送信はされません。コピーした内容を普段の連絡手段に貼り付けてお使いください。</p></form></div></section></main><div id="site-footer"></div></body></html>
